<svg xmlns="http://www.w3.org/2000/svg" width="700" height="760" viewBox="0 0 700 760" font-family="Georgia, 'Times New Roman', serif" fill="#111">
<rect width="700" height="760" fill="#fff"/>
<text x="370" y="32" font-size="18" text-anchor="middle">Annual Mean Forest Patch Size</text>
<text x="370" y="56" font-size="18" text-anchor="middle">for Three Land Use Capability Classes</text>
<text x="370" y="80" font-size="18" text-anchor="middle">in the Chorotega Region, Costa Rica</text>
<!-- grid -->
<g stroke="#999" stroke-width="1">
<line x1="100" y1="110" x2="640" y2="110"/><line x1="100" y1="160" x2="640" y2="160"/><line x1="100" y1="210" x2="640" y2="210"/><line x1="100" y1="260" x2="640" y2="260"/><line x1="100" y1="310" x2="640" y2="310"/><line x1="100" y1="360" x2="640" y2="360"/>
<line x1="100" y1="110" x2="100" y2="410"/><line x1="150" y1="110" x2="150" y2="410"/><line x1="290" y1="110" x2="290" y2="410"/><line x1="430" y1="110" x2="430" y2="410"/><line x1="570" y1="110" x2="570" y2="410"/><line x1="640" y1="110" x2="640" y2="410"/>
</g>
<line x1="100" y1="410" x2="640" y2="410" stroke="#111" stroke-width="1.5"/>
<line x1="100" y1="110" x2="100" y2="410" stroke="#111" stroke-width="1.5"/>
<g font-size="16" text-anchor="end">
<text x="92" y="116">150</text><text x="92" y="166">125</text><text x="92" y="216">100</text><text x="92" y="266">75</text><text x="92" y="316">50</text><text x="92" y="366">25</text><text x="92" y="416">0</text>
</g>
<g font-size="16" text-anchor="middle">
<text x="150" y="436">1960</text><text x="290" y="436">1979</text><text x="430" y="436">1986</text><text x="570" y="436">2000</text>
<text x="370" y="476">Year</text>
</g>
<text transform="translate(34,260) rotate(-90)" font-size="16" text-anchor="middle">Mean patch size (hectares)</text>
<!-- Class VI (dashed, squares) -->
<polyline points="150,276 290,256 430,370 570,338" fill="none" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/>
<!-- Class VII (dotted, circles) -->
<polyline points="150,258 290,236 430,358 570,312" fill="none" stroke="#222" stroke-width="2.2" stroke-dasharray="2 4"/>
<!-- Class VIII (solid, triangles) -->
<polyline points="150,156 290,158 430,338 570,290" fill="none" stroke="#111" stroke-width="2"/>
<g fill="#111"><polygon points="150,148 157,160 143,160"/><polygon points="290,150 297,162 283,162"/><polygon points="430,330 437,342 423,342"/><polygon points="570,282 577,294 563,294"/></g>
<g fill="#bbb" stroke="#222" stroke-width="1.5"><rect x="145" y="271" width="10" height="10"/><rect x="285" y="251" width="10" height="10"/><rect x="425" y="365" width="10" height="10"/><rect x="565" y="333" width="10" height="10"/></g>
<g fill="#fff" stroke="#222" stroke-width="1.5"><circle cx="150" cy="258" r="5.5"/><circle cx="290" cy="236" r="5.5"/><circle cx="430" cy="358" r="5.5"/><circle cx="570" cy="312" r="5.5"/></g>
<!-- legend -->
<rect x="110" y="505" width="470" height="215" fill="#fff" stroke="#111" stroke-width="1.5"/>
<line x1="125" y1="535" x2="190" y2="535" stroke="#111" stroke-width="2"/><polygon points="157,527 164,540 150,540" fill="#111"/>
<text x="205" y="541" font-size="16">Class VIII (cannot be used for</text>
<text x="205" y="565" font-size="16">commercial crops)</text>
<line x1="125" y1="605" x2="190" y2="605" stroke="#222" stroke-width="2" stroke-dasharray="8 5"/><rect x="152" y="600" width="10" height="10" fill="#bbb" stroke="#222" stroke-width="1.5"/>
<text x="205" y="611" font-size="16">Class VI (severe limitations on</text>
<text x="205" y="635" font-size="16">use for crops)</text>
<line x1="125" y1="675" x2="190" y2="675" stroke="#222" stroke-width="2.2" stroke-dasharray="2 4"/><circle cx="157" cy="675" r="5.5" fill="#fff" stroke="#222" stroke-width="1.5"/>
<text x="205" y="681" font-size="16">Class VII (very severe</text>
<text x="205" y="705" font-size="16">limitations on use for crops)</text>
</svg>
