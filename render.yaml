# One free Render web service: builds the React site and serves it together with the API.
services:
  - type: web
    name: step12
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # paste your key in the Render dashboard when asked
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false # free backup AI (console.groq.com)
      - key: OPENROUTER_API_KEY
        sync: false # free backup AI (openrouter.ai)
      - key: NVIDIA_API_KEY
        sync: false # build.nvidia.com (free, NVIDIA Developer Program)
      - key: MISTRAL_API_KEY
        sync: false # console.mistral.ai (free tier)
      - key: STRIPE_SECRET_KEY
        sync: false # Visa card payments for Humo Pro (Stripe Checkout); leave empty until ready
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # optional: Stripe webhook for /api/billing/stripe-webhook
      - key: TELEGRAM_MANAGER
        sync: false # e.g. https://t.me/your_manager (Click / Payme payments)
      - key: ADMIN_EMAILS
        sync: false # extra admin emails, comma separated
