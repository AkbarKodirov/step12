# Render's free plan puts the server to sleep after 15 minutes without visitors, and the first
# visitor then waits ~40-50 s while it wakes up. This pings it every 10 minutes so it stays awake.
name: Keep Humo AI awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://step12.onrender.com/api/health || true
